version: "3.8"

services:
  db:
    image: postgres:15

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_management

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always

  backend:
    build:
      context: ./backend

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/inventory_management

    ports:
      - "8000:8000"

    depends_on:
      - db

    restart: always

  frontend:
    build:
      context: ./frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: always

volumes:
  postgres_data:
